[project]
name = "infomedicament-dataeng"
version = "0.1.0"
description = "Data engineering tools for ANSM's infomedicament website"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "tqdm>=4.0",
    "boto3>=1.35",
    "sqlglot>=28.9.0,<29",
    "psycopg2-binary>=2.9.11,<3",
    "sqlalchemy>=2.0,<3",
    "pyyaml>=6.0.3,<7",
    "requests>=2.33.0,<3",
    "frictionless>=5.19.0,<6",
    "pymupdf>=1.28.0,<2",
]

[project.scripts]
infomedicament-dataeng = "infomedicament_dataeng.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.16.3,<0.17",
    "pre-commit>=4.5.1,<5",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
